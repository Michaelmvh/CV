name: Publish CV

on:
  push:
    branches:
      - main
    paths:
      - CV.pdf
  workflow_dispatch:
    inputs:
      dispatch_only:
        description: Test the portfolio deployment without creating a CV release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-cv
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish latest release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dispatch_only }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cv-${{ github.run_number }}
          name: CV ${{ github.run_number }}
          files: CV.pdf
          make_latest: true
          body: Latest published curriculum vitae.

      - name: Trigger portfolio deployment
        if: ${{ env.PORTFOLIO_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PORTFOLIO_DISPATCH_TOKEN }}
        run: >-
          gh api
          --method POST
          repos/Michaelmvh/michaelmvh.github.io/dispatches
          --field event_type=cv-published

      - name: Report unconfigured portfolio deployment
        if: ${{ env.PORTFOLIO_DISPATCH_TOKEN == '' }}
        run: echo "::notice::Add the PORTFOLIO_DISPATCH_TOKEN secret to deploy CV updates to michaelmvh.com."
