name: Publish resume

on:
  push:
    branches:
      - main
    paths:
      - CV.pdf
      - .github/workflows/publish-resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-resume
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: resume-${{ github.run_number }}
          name: Resume ${{ github.run_number }}
          files: CV.pdf
          make_latest: true
          body: Latest published curriculum vitae.
